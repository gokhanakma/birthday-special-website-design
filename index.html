<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sürpriz için tıkla 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e, #fecfef);
    font-family: "Poppins", sans-serif;
    overflow: hidden;
  }

  .container {
    text-align: center;
    animation: fadeIn 1.5s ease forwards;
    opacity: 0;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  h1 {
    color: #fff;
    margin-bottom: 20px;
    font-size: 1.6rem;
    text-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  .btn {
    font-size: 1.2rem;
    padding: 12px 30px;
    border: none;
    border-radius: 50px;
    background: #ff6f91;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(255, 111, 145, 0.4);
    transition: 0.2s;
  }

  .btn:hover {
    transform: scale(1.05);
    filter: brightness(1.1);
  }

  .fade-out {
    animation: fadeOut 0.7s forwards ease;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: scale(0.9); }
  }

</style>
</head>
<body>

<div class="container" id="introBox">
  <h1>Sana özel bir sürprizim var ❤️</h1>
  <button class="btn" onclick="go()">TIKLA 💌</button>
</div>

<script>
function go() {
  document.getElementById("introBox").classList.add("fade-out");

  setTimeout(() => {
    // BURAYA dogum_gunu.html dosyanın adını yazıyoruz
    window.location.href = "dogum_gunu.html";
  }, 650);
}
</script>

</body>
</html>
